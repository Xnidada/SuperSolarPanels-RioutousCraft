buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.4.5-RioutousCraft'
group = 'com.rioutous'
archivesBaseName = 'SuperSolarPanels-RioutousCraft'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.12.2-14.23.5.2847'
    mappings = 'stable_39'
    runDir = 'run'
}

repositories {
    maven { url = uri(project.hasProperty('localMaven') ? project.property('localMaven') : 'local-maven') }
    if (project.hasProperty('localMaven')) {
        maven { url = uri(project.property('localMaven')) }
    }
    maven { url = 'https://maven2.ic2.player.to/' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
    maven { url = 'https://modmaven.dev' }
}

dependencies {
    compile 'net.industrial-craft:industrialcraft-2:2.8.222-ex112:dev'
    deobfCompile 'mezz.jei:jei_1.12.2:4.16.1.302'
}

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

jar {
    manifest {
        attributes 'Implementation-Title': project.name,
                   'Implementation-Version': project.version
    }
}
