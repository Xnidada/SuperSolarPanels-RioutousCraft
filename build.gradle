buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+' 
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '5.1.+' 
}

version = '1.3.1-RioutousCraft'
group = 'com.rioutous'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                super_solar_panels {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                super_solar_panels {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { name = 'IC2'; url = 'https://maven2.ic2.player.to/' }
    maven { name = 'JEI'; url = 'https://dvs1.progwml6.com/files/maven/' }
    maven { name = 'ModMaven'; url = 'https://modmaven.dev' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    implementation fg.deobf('net.industrial-craft:industrialcraft-2:2.8.222-ex112:dev')
    implementation fg.deobf('mezz.jei:jei_1.12.2:4.16.1.302')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: '1.12.2'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'SuperSolarPanels-RioutousCraft',
            'Specification-Vendor': 'RioutousCraft',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'RioutousCraft'
        ])
    }
}
